[package]
name = "td_core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "td_workshop"
path = "src/bin/td_workshop.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# egui/eframe pinned for the box's rustc 1.85 (newer stacks need ≥1.86/1.88).
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "=0.27.2"
# Transitive pins so `cargo update` cannot float past rustc 1.85-compatible releases.
image = "=0.24.9"
url = "=2.5.2"
home = "=0.5.9"
smithay-clipboard = "=0.7.0"
